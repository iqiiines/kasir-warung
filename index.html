<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Warung Sembako</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --background: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1, h2 { margin-top: 0; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 300px;
        }
        .grid-produk {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .card-produk {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #fff;
            transition: transform 0.2s;
        }
        .card-produk:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary { background-color: var(--primary); }
        .btn-success { background-color: var(--success); font-size: 1.1em; padding: 15px; }
        .btn-danger { background-color: var(--danger); width: auto; padding: 5px 10px;}
        .btn-warning { background-color: var(--warning); color: #333; }
        .keranjang-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .total-box {
            font-size: 1.5em;
            font-weight: bold;
            text-align: right;
            margin: 20px 0;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            background: #eee;
            color: #333;
        }
        .flex-buttons {
            display: flex;
            gap: 5px;
        }
        .flex-buttons .btn {
            margin-top: 10px;
        }
        /* Style khusus untuk kolom pencarian */
        .search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #2c3e50;">🏪 Aplikasi Kasir Warung Sembako</h1>

    <div class="container">
        <!-- Panel Kiri: Daftar Produk -->
        <div class="panel" style="flex: 2;">
            <h2>Daftar Produk</h2>
            
            <!-- Fitur Baru: Kolom Pencarian -->
            <input type="text" id="input-cari" class="search-bar" placeholder="🔍 Cari nama barang di sini..." onkeyup="renderProduk()">

            <div class="grid-produk" id="katalog-produk">
                <!-- Produk dirender lewat JS -->
            </div>
            
            <hr style="margin: 30px 0; border: 1px solid #eee;">
            
            <!-- Form Tambah Produk Baru -->
            <h3>Tambah / Update Produk</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 2; min-width: 150px;">
                    <label>Nama Barang</label>
                    <input type="text" id="input-nama" placeholder="Contoh: Beras 1kg">
                </div>
                <div class="form-group" style="flex: 1; min-width: 100px;">
                    <label>Harga (Rp)</label>
                    <input type="number" id="input-harga" placeholder="10000">
                </div>
                <div class="form-group" style="flex: 1; min-width: 100px;">
                    <label>Stok Barang</label>
                    <input type="number" id="input-stok" placeholder="50">
                </div>
                <div style="flex: 1; min-width: 150px; display: flex; gap: 5px; align-items: flex-end; margin-bottom: 15px;">
                    <button id="btn-simpan" class="btn btn-primary" onclick="simpanProduk()" style="margin-top: 0;">Simpan</button>
                    <button id="btn-batal" class="btn btn-danger" onclick="batalEdit()" style="margin-top: 0; display: none; padding: 10px;">Batal</button>
                </div>
            </div>
        </div>

        <!-- Panel Kanan: Keranjang & Checkout -->
        <div class="panel" style="flex: 1;">
            <h2>🛒 Keranjang Belanja</h2>
            <div id="keranjang-belanja">
                <!-- Isi keranjang dirender lewat JS -->
            </div>

            <div class="total-box">
                Sub Total: <br>
                <span id="grand-total" style="color: var(--success);">Rp 0</span>
            </div>

            <button class="btn btn-success" onclick="prosesCheckout()">Bayar & Checkout</button>
        </div>
    </div>

    <script>
        // 1. Inisialisasi Data 
        let produk = JSON.parse(localStorage.getItem('produk_sembako')) || [
            { id: 1, nama: "Beras Pandan Wangi 5kg", harga: 75000, stok: 20 },
            { id: 2, nama: "Minyak Goreng 2L", harga: 32000, stok: 15 },
            { id: 3, nama: "Gula Pasir 1kg", harga: 16000, stok: 30 },
            { id: 4, nama: "Telur Ayam 1kg", harga: 28000, stok: 10 }
        ];
        
        let keranjang = [];
        let editModeId = null; // Variabel untuk mendeteksi mode edit

        function simpanData() {
            localStorage.setItem('produk_sembako', JSON.stringify(produk));
        }

        // 3. Menampilkan Daftar Produk (Ditambah Logika Pencarian)
        function renderProduk() {
            const wadah = document.getElementById('katalog-produk');
            wadah.innerHTML = '';

            // Ambil kata kunci dari kolom pencarian, jadikan huruf kecil semua agar mudah dicocokkan
            const inputCari = document.getElementById('input-cari');
            const kataKunci = inputCari ? inputCari.value.toLowerCase() : "";

            // Filter produk berdasarkan kata kunci pencarian
            const produkTampil = produk.filter(p => p.nama.toLowerCase().includes(kataKunci));

            if (produkTampil.length === 0) {
                wadah.innerHTML = '<p style="color: #999; grid-column: 1 / -1; text-align: center;">Barang tidak ditemukan.</p>';
                return;
            }

            produkTampil.forEach(p => {
                wadah.innerHTML += `
                    <div class="card-produk">
                        <h3 style="margin: 0 0 10px 0; font-size: 1.1em;">${p.nama}</h3>
                        <p style="color: #666; margin: 5px 0;">Rp ${p.harga.toLocaleString('id-ID')}</p>
                        <span class="badge">Stok: ${p.stok}</span>
                        
                        <div class="flex-buttons">
                            <button class="btn btn-primary" style="flex: 2;" onclick="tambahKeKeranjang(${p.id})" ${p.stok === 0 ? 'disabled' : ''}>
                                ${p.stok === 0 ? 'Habis' : '+ Keranjang'}
                            </button>
                            <button class="btn btn-warning" style="flex: 1;" onclick="editProduk(${p.id})">
                                Edit
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 4. Fitur Baru: Tarik data ke form untuk di-edit
        function editProduk(id) {
            const item = produk.find(p => p.id === id);
            if (item) {
                document.getElementById('input-nama').value = item.nama;
                document.getElementById('input-harga').value = item.harga;
                document.getElementById('input-stok').value = item.stok;
                
                // Ubah tampilan tombol
                document.getElementById('btn-simpan').innerText = "Update";
                document.getElementById('btn-simpan').classList.replace('btn-primary', 'btn-warning');
                document.getElementById('btn-batal').style.display = "block"; // Munculkan tombol batal
                
                editModeId = id; // Tandai bahwa kita sedang dalam mode edit
                
                // Scroll sedikit ke bawah agar form terlihat
                document.getElementById('input-nama').focus();
            }
        }

        // 5. Fitur Baru: Batal Edit
        function batalEdit() {
            document.getElementById('input-nama').value = '';
            document.getElementById('input-harga').value = '';
            document.getElementById('input-stok').value = '';
            
            document.getElementById('btn-simpan').innerText = "Simpan";
            document.getElementById('btn-simpan').classList.replace('btn-warning', 'btn-primary');
            document.getElementById('btn-batal').style.display = "none";
            
            editModeId = null;
        }

        // 6. Simpan Produk (Ditambahkan logika untuk Update)
        function simpanProduk() {
            const nama = document.getElementById('input-nama').value;
            const harga = parseInt(document.getElementById('input-harga').value);
            const stok = parseInt(document.getElementById('input-stok').value);

            if(!nama || !harga || isNaN(stok)) {
                alert("Mohon isi nama, harga, dan stok barang!");
                return;
            }

            if (editModeId !== null) {
                // MODE UPDATE: Ubah data barang yang ada
                const index = produk.findIndex(p => p.id === editModeId);
                if (index !== -1) {
                    produk[index].nama = nama;
                    produk[index].harga = harga;
                    produk[index].stok = stok;
                }
                alert("Data produk berhasil diupdate!");
            } else {
                // MODE TAMBAH BARU
                const produkLama = produk.find(p => p.nama.toLowerCase() === nama.toLowerCase());
                if(produkLama) {
                    // Jika nama sama, otomatis tambah stok
                    produkLama.harga = harga;
                    produkLama.stok += stok; 
                } else {
                    const idBaru = produk.length > 0 ? Math.max(...produk.map(p => p.id)) + 1 : 1;
                    produk.push({ id: idBaru, nama, harga, stok });
                }
            }

            simpanData();
            renderProduk();
            batalEdit(); // Kembalikan form ke keadaan semula (kosong)
            
            // Render ulang keranjang jika ada barang di keranjang yang harganya berubah
            renderKeranjang();
        }

        // 7. Menambahkan ke Keranjang
        function tambahKeKeranjang(id) {
            const itemProduk = produk.find(p => p.id === id);
            const itemDiKeranjang = keranjang.find(k => k.id === id);

            if (itemDiKeranjang) {
                if (itemDiKeranjang.qty < itemProduk.stok) {
                    itemDiKeranjang.qty++;
                } else {
                    alert("Stok tidak mencukupi!");
                }
            } else {
                if (itemProduk.stok > 0) {
                    // Buat copy data produk agar jika harga diubah saat ada di keranjang,
                    // harga di keranjang menyesuaikan harga terbaru.
                    keranjang.push({ ...itemProduk, qty: 1 });
                }
            }
            renderKeranjang();
        }

        // 8. Hapus dari keranjang
        function hapusDariKeranjang(id) {
            keranjang = keranjang.filter(k => k.id !== id);
            renderKeranjang();
        }

        // 9. Menampilkan Keranjang & Hitung Sub Total
        function renderKeranjang() {
            const wadah = document.getElementById('keranjang-belanja');
            let grandTotal = 0;
            wadah.innerHTML = '';

            if(keranjang.length === 0) {
                wadah.innerHTML = '<p style="color: #999; text-align: center;">Keranjang masih kosong</p>';
            }

            keranjang.forEach(k => {
                // Ambil harga terbaru dari database jika harganya baru diedit
                const produkAsli = produk.find(p => p.id === k.id);
                const hargaGunakan = produkAsli ? produkAsli.harga : k.harga;

                const subTotal = hargaGunakan * k.qty;
                grandTotal += subTotal;

                wadah.innerHTML += `
                    <div class="keranjang-item">
                        <div style="flex: 2;">
                            <strong style="display:block;">${k.nama}</strong>
                            <small>${k.qty} x Rp ${hargaGunakan.toLocaleString('id-ID')}</small>
                        </div>
                        <div style="flex: 1; text-align: right; font-weight: bold;">
                            Rp ${subTotal.toLocaleString('id-ID')}
                        </div>
                        <button class="btn-danger" onclick="hapusDariKeranjang(${k.id})" style="margin-left: 10px;">X</button>
                    </div>
                `;
            });

            document.getElementById('grand-total').innerText = 'Rp ' + grandTotal.toLocaleString('id-ID');
        }

        // 10. Proses Checkout
        function prosesCheckout() {
            if(keranjang.length === 0) {
                alert("Pilih barang terlebih dahulu!");
                return;
            }

            keranjang.forEach(itemKeranjang => {
                const itemDb = produk.find(p => p.id === itemKeranjang.id);
                if (itemDb) {
                    itemDb.stok -= itemKeranjang.qty;
                }
            });

            simpanData(); 
            keranjang = []; 
            
            renderProduk(); 
            renderKeranjang(); 

            alert("Pembayaran Berhasil! Stok barang telah otomatis dikurangi.");
        }

        // Jalankan saat pertama kali halaman dibuka
        renderProduk();
        renderKeranjang();
    </script>
</body>
</html>
